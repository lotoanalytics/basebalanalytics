name: Robot de béisbol

# Lee la fuente PN (calendario, resultados, posiciones y juego en vivo) y lo
# guarda en Supabase. Ver ANALISIS-PN.md.
#
# SE ACTIVA SIEMPRE A MANO: desde el cron del dueño (cron-job.org llamando a
# la API de GitHub, workflow_dispatch) o con el botón "Run workflow" de la
# pestaña Actions. NO tiene "schedule" (GitHub atrasa esos horarios).
#
# No importa cada cuánto lo llame el cron: el robot mismo mira los HORARIOS
# guardados en la base y decide qué buscar. Si no le toca nada, termina en
# segundos sin abrir el navegador.
on:
  workflow_dispatch:
    inputs:
      solo_leer:
        description: "Modo prueba: 1 = solo leer y mostrar, no guardar nada"
        required: false
        default: "0"
      forzar:
        description: "1 = buscar todo sin mirar los horarios"
        required: false
        default: "0"

permissions:
  contents: write

# Nunca dos corridas a la vez: si llega otra, espera a que termine la anterior.
concurrency:
  group: robot-beisbol
  cancel-in-progress: false

jobs:
  robot:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar archivos
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Caché: la primera corrida baja Chrome y las librerías; las demás las reusan.
      - name: Caché de librerías y Chrome
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.cache/puppeteer
          key: ${{ runner.os }}-node22-robot-beisbol-v2

      - name: Instalar librerías
        run: |
          if [ ! -f package.json ]; then npm init -y > /dev/null; fi
          # Las mismas librerías del robot de LotoAnalytics (stealth para disimular el navegador)
          if [ "${{ steps.cache.outputs.cache-hit }}" = "true" ] && [ -d node_modules/puppeteer ] && [ -d node_modules/@supabase/supabase-js ] && [ -d node_modules/puppeteer-extra-plugin-stealth ]; then
            echo "Librerías ya están en la caché: no se instalan otra vez."
          else
            npm install puppeteer puppeteer-extra puppeteer-extra-plugin-stealth @supabase/supabase-js dotenv --no-audit --no-fund
          fi

      - name: Correr el robot
        timeout-minutes: 4
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SOLO_LEER: ${{ github.event.inputs.solo_leer }}
          FORZAR: ${{ github.event.inputs.forzar }}
        run: |
          mkdir -p registro
          node robot/robot-beisbol.js 2>&1 | tee registro/ultima-corrida.txt
          exit ${PIPESTATUS[0]}

      # Lo que dijo el robot se guarda en la rama "exploracion"
      # (carpeta registro/) para poder revisarlo. No toca la rama main.
      - name: Guardar el registro de la prueba
        if: always()
        run: |
          git config user.name "robot-beisbol"
          git config user.email "robot@users.noreply.github.com"
          git fetch origin exploracion || true
          git checkout -B exploracion origin/exploracion 2>/dev/null || git checkout --orphan exploracion
          git rm -rq --cached . 2>/dev/null || true
          git add -f registro/
          git commit -m "Prueba del robot $(date -u +%F_%H%M)" || exit 0
          git push -f origin exploracion
