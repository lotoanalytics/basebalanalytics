name: Explorar pelotainvernal (solo lectura)

# PRUEBA: abre pelotainvernal.com y anota de dónde saca el calendario,
# los resultados y el juego en vivo. No toca la base de datos.
# Se corre a mano desde la pestaña Actions (botón "Run workflow").
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  explorar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar archivos
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar librerías
        run: |
          if [ ! -f package.json ]; then npm init -y; fi
          npm install puppeteer

      - name: Explorar pelotainvernal
        run: node robot/explorar-pelotainvernal.js

      - name: Guardar lo que se leyó
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prueba-pelotainvernal
          path: prueba-pelotainvernal/
          if-no-files-found: ignore

      # Además guarda lo leído en la rama "exploracion" del repo, para poder
      # revisarlo sin descargar archivos. No toca la rama main.
      - name: Guardar lo leído en la rama exploracion
        if: always()
        run: |
          git config user.name "robot-explorador"
          git config user.email "robot@users.noreply.github.com"
          git checkout --orphan exploracion
          git rm -rq --cached . || true
          git add -f prueba-pelotainvernal/
          git commit -m "Exploración de pelotainvernal $(date -u +%F_%H%M)" || exit 0
          git push -f origin exploracion
