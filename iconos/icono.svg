<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="fondo" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#1d3fd6"/><stop offset=".55" stop-color="#0b1a6e"/><stop offset="1" stop-color="#050a2e"/>
    </radialGradient>
    <radialGradient id="bola" cx="38%" cy="32%" r="72%">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#e9eef8"/><stop offset="1" stop-color="#9aa6c8"/>
    </radialGradient>
    <linearGradient id="barra" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#0dd67a"/><stop offset="1" stop-color="#7dffc4"/>
    </linearGradient>
    <linearGradient id="flecha" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb020"/><stop offset="1" stop-color="#ffe66b"/>
    </linearGradient>
    <filter id="neon" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".5"/></filter>
    <clipPath id="dentro"><circle cx="256" cy="268" r="150"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#fondo)"/>
  <!-- aro de luz -->
  <circle cx="256" cy="268" r="182" fill="none" stroke="#38d9ff" stroke-width="6" opacity=".9" filter="url(#neon)"/>
  <circle cx="256" cy="268" r="198" fill="none" stroke="#38d9ff" stroke-width="2" opacity=".35"/>
  <!-- pelota -->
  <circle cx="256" cy="268" r="150" fill="url(#bola)" filter="url(#sombra)"/>
  <g clip-path="url(#dentro)" fill="none" stroke="#e8303f" stroke-width="7" stroke-linecap="round">
    <path d="M150 140 C205 205 205 330 150 396"/>
    <path d="M362 140 C307 205 307 330 362 396"/>
    <g stroke-width="5">
      <path d="M166 170 l22 -10 M176 196 l23 -6 M182 224 l24 -3 M184 252 l24 0 M184 282 l24 2 M181 310 l24 5 M175 338 l23 8 M165 365 l22 11"/>
      <path d="M346 170 l-22 -10 M336 196 l-23 -6 M330 224 l-24 -3 M328 252 l-24 0 M328 282 l-24 2 M331 310 l-24 5 M337 338 l-23 8 M347 365 l-22 11"/>
    </g>
  </g>
  <!-- barras de análisis -->
  <g filter="url(#neon)">
    <rect x="200" y="262" width="30" height="72" rx="8" fill="url(#barra)"/>
    <rect x="241" y="226" width="30" height="108" rx="8" fill="url(#barra)"/>
    <rect x="282" y="186" width="30" height="148" rx="8" fill="url(#barra)"/>
  </g>
  <!-- flecha que sube y sale de la pelota -->
  <g filter="url(#neon)" fill="none" stroke="url(#flecha)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <path d="M150 318 L222 244 L262 270 L380 140"/>
    <path d="M336 136 L384 136 L384 184"/>
  </g>
</svg>
